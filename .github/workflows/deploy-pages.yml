name: Deploy Control de Ingresos (PWA)

# Publica SOLO la carpeta control-ingresos/ como sitio de GitHub Pages.
# El resto del repositorio (sitio del estudio) NO se sirve en esta URL.

on:
  push:
    branches:
      - claude/income-control-app-peqsng
      - main
    paths:
      - 'control-ingresos/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: control-ingresos

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
