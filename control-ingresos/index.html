<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Control personal de ingresos: registrá tus ingresos y mirá resúmenes y totales." />
  <title>Control de Ingresos</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f766e" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ingresos" />

  <style>
    :root {
      --bg: #0b1120;
      --bg2: #0f172a;
      --surf: #131c31;
      --surf2: #1a2540;
      --line: rgba(148, 163, 184, 0.16);
      --t1: #f1f5f9;
      --t2: #b8c4d6;
      --t3: #8394ad;
      --acc: #10b981;
      --acc2: #0d9488;
      --acc-soft: rgba(16, 185, 129, 0.14);
      --danger: #f87171;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      --r: 18px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    .light {
      --bg: #eef2f6;
      --bg2: #e6ebf1;
      --surf: #ffffff;
      --surf2: #f4f7fa;
      --line: rgba(15, 23, 42, 0.10);
      --t1: #0f172a;
      --t2: #334155;
      --t3: #64748b;
      --acc-soft: rgba(16, 185, 129, 0.12);
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--t1);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }
    .shell {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, var(--bg2), var(--bg) 240px);
      position: relative;
    }

    /* ---------- Header ---------- */
    header {
      padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 8px;
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand .dot {
      width: 30px; height: 30px; border-radius: 9px;
      background: linear-gradient(145deg, var(--acc), var(--acc2));
      display: grid; place-items: center; color: #fff; font-size: 16px;
      box-shadow: 0 4px 12px rgba(16,185,129,.35);
    }
    .brand h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: .2px; }
    .icon-btn {
      appearance: none; border: 1px solid var(--line); background: var(--surf);
      color: var(--t2); width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center; font-size: 17px; cursor: pointer;
    }
    .icon-btn:active { transform: scale(.94); }

    /* Month switcher */
    .month-nav {
      margin-top: 18px;
      display: flex; align-items: center; justify-content: center; gap: 14px;
    }
    .month-nav button {
      appearance: none; border: none; background: var(--surf); color: var(--t2);
      width: 34px; height: 34px; border-radius: 50%; font-size: 16px; cursor: pointer;
      border: 1px solid var(--line);
    }
    .month-nav button:active { transform: scale(.9); }
    .month-nav .label {
      font-size: 14px; font-weight: 600; color: var(--t2); min-width: 150px;
      text-align: center; text-transform: capitalize;
    }

    /* Hero total */
    .hero {
      text-align: center;
      padding: 14px 20px 24px;
    }
    .hero .cap { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--t3); font-weight: 600; }
    .hero .amount {
      font-size: 40px; font-weight: 800; margin: 6px 0 2px; letter-spacing: -.5px;
      color: var(--t1);
    }
    .hero .sub { font-size: 13px; color: var(--t3); }
    .hero .sub b { color: var(--acc); font-weight: 700; }

    /* ---------- Tabs / content ---------- */
    main {
      flex: 1;
      padding: 4px 16px calc(120px + var(--safe-b));
    }
    .view { display: none; animation: fade .25s ease; }
    .view.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none; } }

    .section-title {
      font-size: 12px; text-transform: uppercase; letter-spacing: .1em;
      color: var(--t3); font-weight: 700; margin: 18px 4px 10px;
    }

    /* Movement list */
    .day-group { margin-bottom: 6px; }
    .day-head {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 10px 6px 6px; font-size: 12px; color: var(--t3);
    }
    .day-head .d-total { font-weight: 700; color: var(--t2); }
    .item {
      display: flex; align-items: center; gap: 12px;
      background: var(--surf); border: 1px solid var(--line);
      border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
      transition: transform .12s ease, background .2s;
    }
    .item:active { transform: scale(.985); background: var(--surf2); }
    .item .emoji {
      width: 40px; height: 40px; border-radius: 11px; flex: none;
      display: grid; place-items: center; font-size: 19px; background: var(--acc-soft);
    }
    .item .meta { flex: 1; min-width: 0; }
    .item .meta .c { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .meta .cat { font-size: 12px; color: var(--t3); }
    .item .val { font-size: 15px; font-weight: 700; color: var(--acc); white-space: nowrap; }

    .empty {
      text-align: center; color: var(--t3); padding: 60px 24px;
    }
    .empty .big { font-size: 46px; margin-bottom: 10px; opacity: .8; }
    .empty p { margin: 4px 0; font-size: 14px; }

    /* Summary cards */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat {
      background: var(--surf); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    }
    .stat .k { font-size: 12px; color: var(--t3); }
    .stat .v { font-size: 20px; font-weight: 800; margin-top: 4px; }

    .card {
      background: var(--surf); border: 1px solid var(--line); border-radius: var(--r);
      padding: 16px; margin-top: 12px;
    }
    /* Category bars */
    .cat-row { margin-bottom: 14px; }
    .cat-row:last-child { margin-bottom: 2px; }
    .cat-row .cr-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .cat-row .cr-top .n { color: var(--t2); font-weight: 600; }
    .cat-row .cr-top .a { color: var(--t2); font-weight: 700; }
    .bar { height: 8px; border-radius: 99px; background: var(--surf2); overflow: hidden; }
    .bar > span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--acc), var(--acc2)); }

    /* Monthly chart */
    .chart { display: flex; align-items: flex-end; gap: 8px; height: 140px; padding-top: 8px; }
    .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
    .chart .col .bar-v {
      width: 100%; max-width: 26px; border-radius: 7px 7px 3px 3px;
      background: linear-gradient(180deg, var(--acc), var(--acc2)); min-height: 3px;
      transition: height .4s var(--ease, ease);
    }
    .chart .col.cur .bar-v { box-shadow: 0 0 0 2px var(--acc-soft); }
    .chart .col .m { font-size: 10px; color: var(--t3); text-transform: capitalize; }

    /* ---------- Bottom nav ---------- */
    .tabbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      max-width: 480px; margin: 0 auto;
      background: color-mix(in srgb, var(--surf) 92%, transparent);
      backdrop-filter: saturate(160%) blur(12px);
      -webkit-backdrop-filter: saturate(160%) blur(12px);
      border-top: 1px solid var(--line);
      display: flex; justify-content: space-around; align-items: center;
      padding: 8px 0 calc(8px + var(--safe-b));
      z-index: 20;
    }
    .tab {
      appearance: none; border: none; background: none; color: var(--t3);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 600; cursor: pointer; padding: 4px 20px;
    }
    .tab .ico { font-size: 20px; }
    .tab.active { color: var(--acc); }

    /* FAB */
    .fab {
      position: fixed; z-index: 25;
      left: 50%; transform: translateX(-50%);
      bottom: calc(64px + var(--safe-b));
      width: 60px; height: 60px; border-radius: 50%; border: none;
      background: linear-gradient(145deg, var(--acc), var(--acc2)); color: #fff;
      font-size: 30px; line-height: 1; cursor: pointer;
      box-shadow: 0 10px 24px rgba(16,185,129,.45);
      display: grid; place-items: center;
    }
    .fab:active { transform: translateX(-50%) scale(.92); }

    /* ---------- Sheet (form) ---------- */
    .backdrop {
      position: fixed; inset: 0; background: rgba(2, 6, 20, .55); z-index: 40;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      max-width: 480px; margin: 0 auto;
      background: var(--surf); border-radius: 22px 22px 0 0;
      padding: 10px 20px calc(24px + var(--safe-b));
      transform: translateY(110%); transition: transform .3s var(--ease, cubic-bezier(.22,1,.36,1));
      box-shadow: var(--shadow);
    }
    .sheet.open { transform: translateY(0); }
    .grabber { width: 42px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 14px; }
    .sheet h2 { font-size: 18px; margin: 0 0 4px; }
    .sheet .amt-wrap { text-align: center; margin: 14px 0 8px; }
    .sheet .amt-wrap .pfx { font-size: 26px; color: var(--t3); font-weight: 700; vertical-align: 6px; }
    .sheet input.amt {
      font-size: 42px; font-weight: 800; text-align: center; width: 70%;
      background: none; border: none; color: var(--t1); outline: none;
    }
    .field { margin-top: 14px; }
    .field label { display: block; font-size: 12px; color: var(--t3); margin-bottom: 6px; font-weight: 600; letter-spacing: .04em; }
    .field input, .field select {
      width: 100%; font-size: 15px; padding: 13px 14px; border-radius: 12px;
      background: var(--surf2); border: 1px solid var(--line); color: var(--t1); outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--acc); }
    .cat-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      appearance: none; border: 1px solid var(--line); background: var(--surf2);
      color: var(--t2); padding: 9px 12px; border-radius: 99px; font-size: 13px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .chip.active { background: var(--acc-soft); border-color: var(--acc); color: var(--acc); font-weight: 700; }
    .sheet .actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn {
      flex: 1; appearance: none; border: none; border-radius: 13px; padding: 15px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn.primary { background: linear-gradient(145deg, var(--acc), var(--acc2)); color: #fff; }
    .btn.primary:disabled { opacity: .5; }
    .btn.ghost { background: var(--surf2); color: var(--t2); flex: 0 0 auto; padding: 15px 18px; }
    .btn.del { background: rgba(248,113,113,.12); color: var(--danger); flex: 0 0 auto; padding: 15px 18px; }

    /* Install banner */
    .install {
      margin: 12px 4px 0; background: var(--acc-soft); border: 1px solid var(--acc);
      border-radius: 14px; padding: 12px 14px; display: none; align-items: center; gap: 12px;
    }
    .install.show { display: flex; }
    .install .txt { flex: 1; font-size: 13px; color: var(--t2); }
    .install .txt b { color: var(--t1); }
    .install button {
      appearance: none; border: none; background: var(--acc); color: #fff; font-weight: 700;
      border-radius: 10px; padding: 9px 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .install .close { background: none; color: var(--t3); padding: 6px; font-size: 16px; }

    .toast {
      position: fixed; bottom: calc(140px + var(--safe-b)); left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--t1); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-size: 13px; font-weight: 600;
      z-index: 60; opacity: 0; pointer-events: none; transition: all .25s; box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="top-row">
        <div class="brand">
          <div class="dot">📈</div>
          <h1>Ingresos</h1>
        </div>
        <button class="icon-btn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
      </div>

      <div class="month-nav">
        <button id="prevMonth" aria-label="Mes anterior">‹</button>
        <div class="label" id="monthLabel">—</div>
        <button id="nextMonth" aria-label="Mes siguiente">›</button>
      </div>

      <div class="hero">
        <div class="cap">Total del mes</div>
        <div class="amount" id="monthTotal">$0</div>
        <div class="sub" id="monthSub">Sin movimientos</div>
      </div>

      <div class="install" id="installBanner">
        <div class="txt"><b>Instalá la app</b> en tu celular para abrirla como una app nativa.</div>
        <button id="installBtn">Instalar</button>
        <button class="icon-btn close" id="installClose" aria-label="Cerrar">✕</button>
      </div>
    </header>

    <main>
      <!-- Vista movimientos -->
      <section class="view active" id="view-mov">
        <div id="movList"></div>
      </section>

      <!-- Vista resumen -->
      <section class="view" id="view-res">
        <div class="stat-grid">
          <div class="stat"><div class="k">Total del año</div><div class="v" id="yearTotal">$0</div></div>
          <div class="stat"><div class="k">Promedio mensual</div><div class="v" id="avgMonth">$0</div></div>
          <div class="stat"><div class="k">Mejor mes</div><div class="v" id="bestMonth">—</div></div>
          <div class="stat"><div class="k">Movimientos (año)</div><div class="v" id="yearCount">0</div></div>
        </div>

        <div class="section-title">Últimos 6 meses</div>
        <div class="card"><div class="chart" id="chart"></div></div>

        <div class="section-title">Por categoría · <span id="catMonthLbl">este mes</span></div>
        <div class="card" id="catBreak"></div>
      </section>
    </main>

    <button class="fab" id="fab" aria-label="Agregar ingreso">＋</button>

    <nav class="tabbar">
      <button class="tab active" data-view="mov"><span class="ico">🧾</span>Movimientos</button>
      <button class="tab" data-view="res"><span class="ico">📊</span>Resumen</button>
    </nav>
  </div>

  <!-- Sheet -->
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grabber"></div>
    <h2 id="sheetTitle">Nuevo ingreso</h2>
    <div class="amt-wrap">
      <span class="pfx">$</span>
      <input class="amt" id="fAmount" type="text" inputmode="decimal" placeholder="0" autocomplete="off" />
    </div>
    <div class="field">
      <label>Concepto</label>
      <input id="fConcept" type="text" placeholder="Ej: Sueldo, venta, honorario…" autocomplete="off" />
    </div>
    <div class="field">
      <label>Categoría</label>
      <div class="cat-chips" id="catChips"></div>
    </div>
    <div class="field">
      <label>Fecha</label>
      <input id="fDate" type="date" />
    </div>
    <div class="actions">
      <button class="btn del" id="deleteBtn" style="display:none">🗑</button>
      <button class="btn ghost" id="cancelBtn">Cancelar</button>
      <button class="btn primary" id="saveBtn" disabled>Guardar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (function () {
    'use strict';

    // ---------- Estado / persistencia ----------
    const KEY = 'ingresos.v1';
    const THEME_KEY = 'ingresos.theme';
    let data = load();
    let current = new Date(); current.setDate(1); // mes visible
    let editingId = null;

    const CATS = [
      { id: 'sueldo',     name: 'Sueldo',      emoji: '💼' },
      { id: 'freelance',  name: 'Freelance',   emoji: '💻' },
      { id: 'ventas',     name: 'Ventas',      emoji: '🛍️' },
      { id: 'alquiler',   name: 'Alquileres',  emoji: '🏠' },
      { id: 'intereses',  name: 'Intereses',   emoji: '💹' },
      { id: 'reintegro',  name: 'Reintegros',  emoji: '↩️' },
      { id: 'regalo',     name: 'Regalos',     emoji: '🎁' },
      { id: 'otros',      name: 'Otros',       emoji: '✨' }
    ];
    const catById = Object.fromEntries(CATS.map(c => [c.id, c]));
    let selectedCat = 'sueldo';

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; }
      catch (e) { return []; }
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

    // ---------- Formato ----------
    const fmt = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 });
    const fmtDec = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    function money(n) { return fmt.format(Math.round(n)); }
    const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
    function parseDate(s) { const [y,m,dd] = s.split('-').map(Number); return new Date(y, m - 1, dd); }

    // ---------- Elementos ----------
    const $ = (id) => document.getElementById(id);
    const monthLabel = $('monthLabel'), monthTotal = $('monthTotal'), monthSub = $('monthSub');
    const movList = $('movList');

    // ---------- Render principal ----------
    function render() {
      monthLabel.textContent = MONTHS[current.getMonth()] + ' ' + current.getFullYear();
      const mk = monthKey(current);
      const monthItems = data.filter(x => x.date.slice(0, 7) === mk)
                             .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
      const total = monthItems.reduce((s, x) => s + x.amount, 0);
      monthTotal.textContent = money(total);
      monthSub.textContent = monthItems.length
        ? monthItems.length + ' movimiento' + (monthItems.length > 1 ? 's' : '')
        : 'Sin movimientos';

      renderList(monthItems);
      renderSummary();
    }

    function renderList(items) {
      if (!items.length) {
        movList.innerHTML =
          '<div class="empty"><div class="big">🧾</div><p><b>No hay ingresos este mes</b></p>' +
          '<p>Tocá el botón + para registrar el primero.</p></div>';
        return;
      }
      // agrupar por día
      const groups = {};
      items.forEach(it => { (groups[it.date] = groups[it.date] || []).push(it); });
      const dates = Object.keys(groups).sort((a, b) => b.localeCompare(a));
      let html = '';
      dates.forEach(dt => {
        const dObj = parseDate(dt);
        const dayTotal = groups[dt].reduce((s, x) => s + x.amount, 0);
        const label = dObj.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
        html += '<div class="day-group"><div class="day-head"><span>' + label +
                '</span><span class="d-total">' + money(dayTotal) + '</span></div>';
        groups[dt].forEach(it => {
          const c = catById[it.cat] || { emoji: '✨', name: it.cat };
          html += '<div class="item" data-id="' + it.id + '">' +
                    '<div class="emoji">' + c.emoji + '</div>' +
                    '<div class="meta"><div class="c">' + escapeHtml(it.concept || c.name) + '</div>' +
                    '<div class="cat">' + c.name + '</div></div>' +
                    '<div class="val">+' + money(it.amount) + '</div></div>';
        });
        html += '</div>';
      });
      movList.innerHTML = html;
      movList.querySelectorAll('.item').forEach(el =>
        el.addEventListener('click', () => openSheet(Number(el.dataset.id))));
    }

    function renderSummary() {
      const year = current.getFullYear();
      const yearItems = data.filter(x => Number(x.date.slice(0, 4)) === year);
      const yearTotal = yearItems.reduce((s, x) => s + x.amount, 0);
      $('yearTotal').textContent = money(yearTotal);
      $('yearCount').textContent = yearItems.length;

      // totales por mes del año
      const byMonth = new Array(12).fill(0);
      yearItems.forEach(x => { byMonth[parseDate(x.date).getMonth()] += x.amount; });
      const activeMonths = byMonth.filter(v => v > 0).length || 1;
      $('avgMonth').textContent = money(yearTotal / activeMonths);
      const best = byMonth.indexOf(Math.max(...byMonth));
      $('bestMonth').textContent = yearTotal > 0 ? MONTHS[best].slice(0, 3) + '.' : '—';

      // gráfico últimos 6 meses (relativo al mes visible)
      const chart = $('chart');
      const cols = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(current.getFullYear(), current.getMonth() - i, 1);
        const mk = monthKey(d);
        const t = data.filter(x => x.date.slice(0, 7) === mk).reduce((s, x) => s + x.amount, 0);
        cols.push({ label: MONTHS[d.getMonth()].slice(0, 3), total: t, isCur: i === 0 });
      }
      const max = Math.max(1, ...cols.map(c => c.total));
      chart.innerHTML = cols.map(c => {
        const h = Math.round((c.total / max) * 100);
        return '<div class="col ' + (c.isCur ? 'cur' : '') + '">' +
               '<div class="bar-v" style="height:' + (c.total ? Math.max(h, 3) : 3) + '%"></div>' +
               '<div class="m">' + c.label + '</div></div>';
      }).join('');

      // por categoría (mes visible)
      const mk = monthKey(current);
      const monthItems = data.filter(x => x.date.slice(0, 7) === mk);
      $('catMonthLbl').textContent = MONTHS[current.getMonth()] + ' ' + year;
      const catTotals = {};
      monthItems.forEach(x => { catTotals[x.cat] = (catTotals[x.cat] || 0) + x.amount; });
      const entries = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
      const box = $('catBreak');
      if (!entries.length) {
        box.innerHTML = '<div style="color:var(--t3);font-size:13px;text-align:center;padding:12px">Sin datos este mes.</div>';
        return;
      }
      const totalMonth = entries.reduce((s, e) => s + e[1], 0);
      box.innerHTML = entries.map(([cid, val]) => {
        const c = catById[cid] || { emoji: '✨', name: cid };
        const pct = Math.round((val / totalMonth) * 100);
        return '<div class="cat-row"><div class="cr-top"><span class="n">' + c.emoji + ' ' + c.name +
               ' · ' + pct + '%</span><span class="a">' + money(val) + '</span></div>' +
               '<div class="bar"><span style="width:' + pct + '%"></span></div></div>';
      }).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    // ---------- Sheet ----------
    const backdrop = $('backdrop'), sheet = $('sheet');
    const fAmount = $('fAmount'), fConcept = $('fConcept'), fDate = $('fDate');
    const saveBtn = $('saveBtn'), deleteBtn = $('deleteBtn');

    function buildChips() {
      $('catChips').innerHTML = CATS.map(c =>
        '<button type="button" class="chip" data-cat="' + c.id + '">' + c.emoji + ' ' + c.name + '</button>'
      ).join('');
      $('catChips').querySelectorAll('.chip').forEach(ch =>
        ch.addEventListener('click', () => { selectedCat = ch.dataset.cat; syncChips(); }));
    }
    function syncChips() {
      $('catChips').querySelectorAll('.chip').forEach(ch =>
        ch.classList.toggle('active', ch.dataset.cat === selectedCat));
    }

    function parseAmount(str) {
      if (!str) return 0;
      // acepta "1.234,56" o "1234.56" o "1234"
      let s = String(str).trim().replace(/\s/g, '');
      if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
      const n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }

    function openSheet(id) {
      editingId = id || null;
      buildChips();
      if (editingId) {
        const it = data.find(x => x.id === editingId);
        $('sheetTitle').textContent = 'Editar ingreso';
        fAmount.value = Number.isInteger(it.amount) ? String(it.amount) : fmtDec.format(it.amount);
        fConcept.value = it.concept || '';
        fDate.value = it.date;
        selectedCat = it.cat;
        deleteBtn.style.display = '';
      } else {
        $('sheetTitle').textContent = 'Nuevo ingreso';
        fAmount.value = '';
        fConcept.value = '';
        fDate.value = toInputDate(new Date());
        selectedCat = 'sueldo';
        deleteBtn.style.display = 'none';
      }
      syncChips();
      validate();
      backdrop.classList.add('open');
      sheet.classList.add('open');
      if (!editingId) setTimeout(() => fAmount.focus(), 320);
    }
    function closeSheet() {
      backdrop.classList.remove('open');
      sheet.classList.remove('open');
      if (document.activeElement) document.activeElement.blur();
    }
    function toInputDate(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function validate() { saveBtn.disabled = !(parseAmount(fAmount.value) > 0 && fDate.value); }

    function saveEntry() {
      const amount = parseAmount(fAmount.value);
      if (amount <= 0 || !fDate.value) return;
      if (editingId) {
        const it = data.find(x => x.id === editingId);
        it.amount = amount; it.concept = fConcept.value.trim(); it.cat = selectedCat; it.date = fDate.value;
        toast('Ingreso actualizado');
      } else {
        data.push({ id: Date.now(), amount, concept: fConcept.value.trim(), cat: selectedCat, date: fDate.value });
        toast('Ingreso guardado ✓');
      }
      save();
      // saltar al mes del ingreso guardado
      current = parseDate(fDate.value); current.setDate(1);
      closeSheet();
      render();
    }
    function deleteEntry() {
      if (!editingId) return;
      if (!confirm('¿Eliminar este ingreso?')) return;
      data = data.filter(x => x.id !== editingId);
      save(); closeSheet(); render();
      toast('Ingreso eliminado');
    }

    // ---------- Toast ----------
    let toastT;
    function toast(msg) {
      const el = $('toast'); el.textContent = msg; el.classList.add('show');
      clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1900);
    }

    // ---------- Tema ----------
    function applyTheme(t) {
      document.body.classList.toggle('light', t === 'light');
      $('themeBtn').textContent = t === 'light' ? '☀️' : '🌙';
      document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'light' ? '#10b981' : '#0f766e');
    }
    let theme = localStorage.getItem(THEME_KEY) || 'dark';
    applyTheme(theme);

    // ---------- Eventos ----------
    $('prevMonth').addEventListener('click', () => { current.setMonth(current.getMonth() - 1); render(); });
    $('nextMonth').addEventListener('click', () => { current.setMonth(current.getMonth() + 1); render(); });
    $('fab').addEventListener('click', () => openSheet(null));
    $('cancelBtn').addEventListener('click', closeSheet);
    backdrop.addEventListener('click', closeSheet);
    saveBtn.addEventListener('click', saveEntry);
    deleteBtn.addEventListener('click', deleteEntry);
    fAmount.addEventListener('input', validate);
    fDate.addEventListener('input', validate);
    $('themeBtn').addEventListener('click', () => {
      theme = theme === 'light' ? 'dark' : 'light';
      localStorage.setItem(THEME_KEY, theme); applyTheme(theme);
    });
    document.querySelectorAll('.tab').forEach(tab =>
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const v = tab.dataset.view;
        $('view-mov').classList.toggle('active', v === 'mov');
        $('view-res').classList.toggle('active', v === 'res');
      }));

    // ---------- Instalación PWA ----------
    let deferredPrompt = null;
    const banner = $('installBanner');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); deferredPrompt = e;
      if (localStorage.getItem('ingresos.installDismiss') !== '1') banner.classList.add('show');
    });
    $('installBtn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null; banner.classList.remove('show');
    });
    $('installClose').addEventListener('click', () => {
      banner.classList.remove('show'); localStorage.setItem('ingresos.installDismiss', '1');
    });
    window.addEventListener('appinstalled', () => banner.classList.remove('show'));

    // ---------- Service worker ----------
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }

    render();
  })();
  </script>
</body>
</html>
